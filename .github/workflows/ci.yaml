name: CI

on:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Test
      run: go test ./...

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -trimpath -o /tmp/hasher ./cmd/hasher